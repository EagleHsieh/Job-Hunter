# Edit freely. Matching is case-insensitive substring matching against the job TITLE.

# A job is kept only if its title contains at least one of these.
title_keywords:
  # hardware / silicon
  - hardware
  - electrical
  - electronics
  - validation
  - silicon
  - asic
  - rtl
  - design engineer
  - verification
  - embedded
  - firmware
  - fpga
  - signal integrity
  - power integrity
  - test engineer
  - systems engineer
  - system engineer
  - board
  - pcb
  # AI/ML, HPC, cloud, server (Eagle's focus from Nov 2026, weighted like hardware; the specific phrases keep generic software roles out)
  - ai engineer
  - machine learning
  - deep learning
  - ml engineer
  - hpc
  - high performance computing
  - applied ai
  - ai/ml
  - cloud engineer
  - cloud infrastructure
  - server engineer
  # quantum
  - quantum
  - quantum computing
  # quant trading / fintech
  - quant
  - trader
  - quantitative researcher
  - trading
  - market maker
  - systematic
  # consulting
  - consultant
  - business analyst
  - associate

# A job is dropped if its title contains any of these.
title_exclude:
  - sales
  - recruiter
  - marketing
  - legal
  - counsel
  - account executive
  - customer success
  - nurse
  - driver
  - warehouse
  # seen in the first dry run: matched a keyword but are not your target roles
  - phd
  - postdoc
  - technician
  - technologist
  - operator
  - operations
  - data center
  - facilities
  - field service
  - it systems
  - customer service
  - web design
  - investor relations
  - capital markets
  - planner
  - construction
  - biology

# Drop postings whose stated required experience exceeds this many years.
max_required_years: 3

# Prefer the company's own application page over a job-board link. {id} is the posting id from the feed.
# Companies not listed here keep the link the feed provides.
official_links:
  imc: "https://www.imc.com/us/careers/jobs/{id}"

# Discovery: scan a public new-grad list for employers that are NOT on your Watchlist.
# categories: which lists to read (Hardware, Quant, AI/ML/Data, Software, Product).
# trusted_categories: for these, any title passes the keyword check (the list already says hardware).
# AI/ML/Data and Software are scanned too, but their titles still have to match a keyword above.
# Everything else (US location, senior, PhD, shift work, citizenship) is still filtered.
discovery:
  categories: [Hardware, Quant, AI/ML/Data, Software]
  trusted_categories: [Hardware]

# Per company, per run: only the best-matching roles reach the sheet (same title in several cities counts once).
max_per_company: 2
# Roles per company in the whole sheet: once a company has this many rows, a new role is added only if it
# scores higher than the lowest-scoring role already there.
max_per_company_total: 3

# Don't feed one employer day after day (or after you applied/engaged): a company shown in the last
# `cooldown_days` days, or already applied/interviewing/rejected, is only shown again for a role scoring at
# least `great_match_score`, and at most `recent_company_max` per run.
cooldown_days: 7
great_match_score: 15
recent_company_max: 1

# Overall limit per run: the best-scoring roles across all companies. The rest are not marked as seen,
# so they appear on later days as the backlog drains. 0 = no limit.
max_new_per_day: 20

# Roles at schools and universities are skipped; you want industry. Regex on the lowercase company name.
exclude_company_patterns:
  - '\buniversity\b'
  - '\bcollege\b'
  - 'institute of technology'
# Exceptions: employers whose name contains one of those words but are companies.
keep_companies:
  - akuna capital university

# Employers flagged as citizen / permanent-resident only (lowercase). Never fed, whatever the role.
blocked_companies:
  - rtx
  - raytheon
  - raytheon technologies

# How well a title fits you (EE/IC/validation/signal integrity, then quant). A keyword adds its weight once.
# Used only to pick each company's top roles; edit freely.
early_career_bonus: 3
# Jobs from a trusted discovery category (Hardware) get this base score even without a keyword.
trusted_category_bonus: 3
# Roles scoring below this never reach the sheet (software-only roles score 0 or less).
min_score: 3

# Application window: skip postings whose JD deadline has passed, that were posted more than this many days
# ago, or whose posting page says it is closed / gone (checked live; if the page cannot be read the role is kept).
max_posting_age_days: 60
check_open: true
# Title score that counts as 100 in the sheet's Match Score column (until the JD-based matcher exists).
match_score_full: 25
title_weights:
  signal integrity: 10
  power integrity: 10
  validation: 8
  verification: 7
  hardware: 7
  mixed signal: 7
  mixed-signal: 7
  analog: 6
  asic: 6
  rtl: 6
  fpga: 6
  silicon: 6
  digital design: 5
  design engineer: 5
  electrical: 5
  board: 5
  pcb: 5
  quantum: 5
  trader: 8
  quant: 6
  trading: 4
  market mak: 5
  systematic: 3
  test engineer: 4
  ai engineer: 7
  machine learning: 7
  deep learning: 7
  ml engineer: 7
  applied ai: 7
  ai/ml: 7
  hpc: 7
  high performance computing: 7
  cloud engineer: 6
  cloud infrastructure: 6
  server engineer: 6
  quantum computing: 3
  quantitative researcher: 3
  embedded: 3
  firmware: 3
  systems engineer: 2
  software: -4
  # Semiconductor: R&D, design, IC design, hardware and quant roles are all equal priority; only the
  # repetitive fab, packaging and equipment work you do not want is pushed down.
  fabrication: -20
  packaging: -10
  equipment: -10
  process engineer: -12
  process integration: -12
  manufacturing: -8
  yield: -8
  assembly: -6
  cleanroom: -20
  clean room: -20
  lithography: -20
  thin film: -20
  wafer: -15
  deposition: -15
  etch engineer: -15

# Same idea for the JD text: roles that are mostly cleanroom / wafer-fab work are pushed down even when the
# title looks fine (a one-off mention in a hardware role still leaves it above min_score).
description_weights:
  cleanroom: -6
  clean room: -6
  photolithography: -6
  lithography: -6
  wafer fab: -6
  semiconductor fab: -6
  thin film deposition: -6

# TEMPORARY BOOST (none active). To raise limits or add roles for a few days only, add a section like this;
# it applies from `date` through `until` (US Central, inclusive; leave `until` out for one day) and is ignored
# on every other day:
# one_day_boost:
#   date: 2026-12-01
#   until: 2026-12-03
#   max_new_per_day: 45
#   max_per_company: 3
#   extra_discovery_categories: [Product]
#   extra_title_keywords: [product manager]
#   extra_title_weights: {product manager: 6}
